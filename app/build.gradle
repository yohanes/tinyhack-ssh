plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tinyhack.ssh'
    compileSdk 37
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.tinyhack.ssh"
        minSdk 34
        targetSdk 36
        versionCode 8
        versionName "1.1.2"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "boolean", "STORAGE_ACCESS_AVAILABLE", "false"
            buildConfigField "String", "DISTRIBUTION", '"play"'
        }
        fdroid {
            dimension "distribution"
            buildConfigField "boolean", "STORAGE_ACCESS_AVAILABLE", "true"
            buildConfigField "String", "DISTRIBUTION", '"fdroid"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    // Separate app identity for device development; UML ships in all builds.
    if (providers.gradleProperty('umlExperiment').isPresent()) {
        buildTypes.debug.applicationIdSuffix = '.uml'
        buildTypes.debug.versionNameSuffix = '-uml'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            // Bundled command-line programs are packaged as lib*.so and must
            // exist as executable files under nativeLibraryDir at runtime.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
